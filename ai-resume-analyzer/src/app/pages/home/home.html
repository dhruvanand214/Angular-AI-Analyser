<section class="home-shell">
  <p class="kicker">Select Analysis</p>
  <h2 class="hero-title">Pick Your Resume Workflow</h2>
  <p class="hero-copy">Separate screens for input and output keep the flow simple, fast, and focused.</p>

  <div class="mode-grid">
    <button type="button" class="mode-tile" (click)="selectAts()">
      <div class="tile-top">
        <span class="tile-badge">01</span>
        <span class="tile-arrow">Start</span>
      </div>
      <h3>ATS Score Check</h3>
      <p>Upload resume and get ATS quality insights with strengths and weaknesses.</p>
    </button>

    <button type="button" class="mode-tile alt" (click)="selectJd()">
      <div class="tile-top">
        <span class="tile-badge">02</span>
        <span class="tile-arrow">Match</span>
      </div>
      <h3>ATS + Job Description Match</h3>
      <p>Upload resume plus JD to find missing keywords and practical improvement points.</p>
    </button>
  </div>
</section>
